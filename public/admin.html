<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACIS POS Admin</title><link rel="icon" href="/assets/acis-pos-icon.png"><link rel="stylesheet" href="/styles.css"><style>
body{margin:0;background:#f5f7f3;color:#173528;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}.admin-login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#073e27,#0b6b3a 55%,#f97316)}.admin-login-card{width:min(420px,90vw);background:white;border-radius:24px;padding:32px;box-shadow:0 25px 80px #0004}.admin-login-card img{width:210px;display:block;margin:0 auto 20px}.admin-login-card h1{font-size:26px;margin:0 0 6px}.admin-login-card p{color:#6a7b70}.admin-shell{min-height:100vh}.admin-top{height:72px;background:#063f27;color:#fff;display:flex;align-items:center;gap:18px;padding:0 28px;position:sticky;top:0;z-index:2}.admin-top img{width:130px;background:#fff;border-radius:12px;padding:6px}.admin-top h2{margin:0;font-size:18px}.admin-top .spacer{flex:1}.admin-main{padding:28px;max-width:1500px;margin:auto}.admin-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.admin-kpi,.admin-card{background:#fff;border:1px solid #dfe8e1;border-radius:16px;padding:18px}.admin-kpi span{display:block;color:#728077;font-size:12px}.admin-kpi b{font-size:30px}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{padding:12px 10px;border-bottom:1px solid #edf0ed;text-align:left;vertical-align:top}.admin-table th{font-size:12px;color:#607267;text-transform:uppercase;letter-spacing:.05em}.admin-actions{display:flex;flex-wrap:wrap;gap:6px}.admin-btn{border:1px solid #cddbd1;background:#fff;padding:7px 10px;border-radius:9px;font-weight:700;cursor:pointer}.admin-btn.primary{background:#087443;color:white;border-color:#087443}.admin-btn.warn{background:#fff3e8;color:#be4b00;border-color:#ffd7b5}.admin-btn.danger{background:#fff1f1;color:#b42318;border-color:#ffd1d1}.admin-status{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#eaf7ee;color:#087443}.admin-status.suspended{background:#fff1f1;color:#b42318}.admin-modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:20}.admin-modal-card{width:min(620px,92vw);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px}.admin-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.admin-form label{font-weight:700;font-size:12px}.admin-form input,.admin-form select{width:100%;box-sizing:border-box;margin-top:5px;padding:10px;border:1px solid #d7e1da;border-radius:10px}.user-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #edf0ed}.muted{color:#718078}.hidden{display:none!important}@media(max-width:800px){.admin-kpis{grid-template-columns:1fr}.admin-main{padding:16px}.admin-card{overflow:auto}.admin-form{grid-template-columns:1fr}}
</style></head><body><div id="toast"></div>
<section id="adminLogin" class="admin-login"><form id="adminLoginForm" class="admin-login-card"><img src="/assets/acis-pos-logo.png"><h1>ACIS Platform Admin</h1><p>Kelola langganan customer ACIS POS.</p><label>Username<input id="aUser" autocomplete="username" required></label><label>Password<input id="aPass" type="password" autocomplete="current-password" required></label><button class="primary" style="width:100%;margin-top:8px">Masuk Admin</button></form></section>
<section id="adminApp" class="admin-shell hidden"><header class="admin-top"><img src="/assets/acis-pos-logo.png"><h2>Platform Admin</h2><div class="spacer"></div><span id="adminName"></span><button id="adminChangePassword" class="admin-btn">Ganti Password</button><button id="adminLogout" class="admin-btn">Keluar</button></header><main class="admin-main"><div class="page-head"><div><h1>Langganan Customer</h1><p>Aktivasi manual, periode langganan, user aktif, suspend, dan reset password.</p></div></div><div id="adminKpis" class="admin-kpis"></div><div class="admin-card"><div class="section-title"><h3>Daftar Customer</h3><button class="admin-btn" onclick="loadAdmin()">Refresh</button></div><div class="table-wrap"><table class="admin-table"><thead><tr><th>Customer</th><th>Paket</th><th>Periode</th><th>User</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="tenantRows"></tbody></table></div></div></main></section>
<script src="/admin.js"></script></body></html>
